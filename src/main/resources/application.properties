# H2
#quarkus.datasource.jdbc.url=jdbc:h2:mem:dbctrarq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/dbwebmarket;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=0
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.db-kind=h2

# Habilita console web do H2
quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2

# inserindo dados no bd
quarkus.hibernate-orm.sql-load-script=carregar_bd.sql

# HIBERNATE ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true
quarkus.hibernate-orm.jdbc.statement-batch-size=0

# Swagger-ui
quarkus.swagger-ui.enabled=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.theme=material

# RESTeasy
quarkus.resteasy-reactive.json.default-object-mapper=true

# LOGGING
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=DEBUG